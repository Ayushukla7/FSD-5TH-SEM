<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <div class="form">

            <div class="input-box">
                <label>Student Name</label>
                <input type="text" id="name">
            </div>

            <div class="input-box">
                <label>Roll No.</label>
                <input type="number" id="roll">
            </div>

            <div class="input-box">
                <label>Course</label>
                <select id="course">
                    <option value="">Select Course</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="BBA">BBA</option>
                </select>
            </div>

            <div class="input-box">
                <label>Marks</label>
                <input type="number" id="marks" min="0" max="100">
            </div>

            <button id="addBtn" onclick="addStudent()">Add Student</button>

        </div>     
        <input
            type="text"
            id="search"
            placeholder="Search by Name or Roll No."
            onkeyup="displayStudents()"
        >     
        <div class="stats">

            <div>
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div>
                <h3>Average Marks</h3>
                <p id="averageMarks">0</p>
            </div>

        </div>      
        <table>

            <thead>
                <tr>
                    <th>Roll No.</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>
    <script src="script.js"></script>
</body>
</html>
